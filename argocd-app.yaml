apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-practice-api

spec:
  project: default

  source:
    repoURL: https://github.com/ianyhchen/devops-practice-lab
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-practice-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true